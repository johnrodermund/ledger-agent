[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-agent"
version = "0.1.0"
description = "LangGraph agent that audits a synthetic ERP ledger in Postgres"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph==0.2.76",
    "anthropic==0.49.0",
    "psycopg[binary]==3.2.6",
    "sqlglot==26.12.1",
    "pydantic==2.10.6",
    "pyyaml==6.0.2",
    "pytest==8.3.5",
]

[project.scripts]
ledger-agent = "ledger_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
