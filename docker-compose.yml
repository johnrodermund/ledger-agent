x-app: &app
  build: .
  depends_on:
    db:
      condition: service_healthy

# Full env (including the admin password) for services that need admin access.
x-admin-env: &admin-env
  env_file:
    - path: .env
      required: false

services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.example}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # seed, agent and evals are placeholders; later tasks give them commands.
  seed:
    <<: [*app, *admin-env]
    volumes:
      - keys:/keys
      - ./src:/app/src

  # No admin password: only the DB host and the ro/rw role passwords.
  agent:
    <<: *app
    environment:
      LEDGER_DB_HOST: ${LEDGER_DB_HOST:-db}
      LEDGER_DB_PORT: ${LEDGER_DB_PORT:-5432}
      LEDGER_RO_PASSWORD: ${LEDGER_RO_PASSWORD:?set LEDGER_RO_PASSWORD, see .env.example}
      LEDGER_RW_PASSWORD: ${LEDGER_RW_PASSWORD:?set LEDGER_RW_PASSWORD, see .env.example}
    volumes:
      - ./src:/app/src

  evals:
    <<: [*app, *admin-env]
    volumes:
      - keys:/keys
      - ./src:/app/src
      - ./evals:/app/evals

  tests:
    <<: [*app, *admin-env]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./evals:/app/evals
      - ./docker-compose.yml:/app/docker-compose.yml:ro

volumes:
  keys:
