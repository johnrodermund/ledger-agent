name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the test values
        run: cp .env.example .env
      - name: Build the images
        run: docker compose build
      - name: Run the tests
        run: docker compose run --rm tests pytest -q
      - name: Run the guardrail suite
        run: docker compose run --rm tests python -m ledger_evals.guardrails
      - name: Run the replay evals
        run: docker compose up --build --abort-on-container-exit --exit-code-from evals
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
